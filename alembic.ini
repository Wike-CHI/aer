# Alembic configuration for AER.
#
# The database URL is intentionally NOT stored here. AER resolves the SQLite path
# at runtime so the CLI, the embedded runtime and the test suite all point at the
# same database without duplicating configuration. Resolution order:
#
#   1. `config.attributes["db_path"]`  -- set by aer.storage.migrations (programmatic)
#   2. `-x db_path=...`                -- e.g. `alembic -x db_path=/tmp/x/aer.db upgrade head`
#   3. `AER_DB_PATH` environment variable
#   4. `./data/aer.db`                 -- the documented default
#
[alembic]
# path to migration scripts, relative to this file
script_location = %(here)s/migrations

# sys.path entry prepended before running migrations, so `import aer` resolves
# even when the package is not installed in the active interpreter.
prepend_sys_path = .

# path_separator = os uses os.pathsep for splitting path lists
path_separator = os

# Zero-padded sequential revision ids: 0001_..., 0002_...
# Chosen over hashes so the schema history is readable in a directory listing.
file_template = %%(rev)s_%%(slug)s

# NOTE: sqlalchemy.url is deliberately absent -- see the header comment.

# Newly generated revisions are immediately normalised to the repository's style,
# so `ruff check .` and `ruff format --check .` stay meaningful for migrations
# instead of that directory having to be excluded from the quality gate.
[post_write_hooks]
hooks = ruff_format, ruff_lint
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = module
ruff_lint.module = ruff
ruff_lint.options = check --fix --quiet REVISION_SCRIPT_FILENAME

# Logging configuration, consumed by migrations/env.py
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
