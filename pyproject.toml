[build-system]
# setuptools>=77 is the floor for the PEP 639 license fields below: `license` as an
# SPDX expression plus `license-files`. The older spelling
# (`license = { text = "Apache-2.0" }`) still builds but warns that it stops working
# in 2027, and a distribution metadata format is not something to migrate under
# deadline pressure.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aer-runtime"
version = "0.6.0"
description = "AER - Agent Experience Runtime (SQLite lightweight edition)"
readme = "README.md"
requires-python = ">=3.12"
# An SPDX expression, not a table. `license-files` puts the LICENSE text into the
# sdist and the wheel as well as into the metadata, which Apache-2.0 section 4
# asks for anyway.
license = "Apache-2.0"
license-files = ["LICENSE"]

keywords = ["agent", "agent-runtime", "experience", "sqlite", "verification", "retrieval", "llm"]

# Deliberately no `License ::` classifier: setuptools rejects a license classifier
# alongside an SPDX `license` expression, and the expression is the modern form.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "alembic>=1.13",
    # Pinned exactly, unlike every other dependency here, and for a concrete
    # reason rather than caution: the knowledge layer is written against this
    # engine's *observed* behaviour -- BM25 coming back negative, `execute()`
    # refusing multiple statements, no MERGE, no edge de-duplication, a full-text
    # query parsed as FTS5 syntax -- and against a schema whose CHECK constraints
    # the extension download URL also embeds (`.../extensions/v0.2.0/...`). A minor
    # bump has already rebuilt the whole index framework once (v0.2 introduced it),
    # so a range here would mean shipping code that was verified against something
    # else. docs/DECISIONS.md D-055 records when to revisit this.
    "neug==0.2.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Infrastructure tests parse deploy/compose.yaml and the workflow files. Parsing
    # them for real is the point: a text-only check of a YAML file cannot tell a
    # valid document from a broken one, and "the deploy file is broken" is exactly
    # the failure that only shows up during an incident.
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Wike-CHI/aer"
Issues = "https://github.com/Wike-CHI/aer/issues"
Changelog = "https://github.com/Wike-CHI/aer/releases"

[tool.setuptools.packages.find]
include = ["aer*"]

# Note for whoever goes looking: there is deliberately **no** `package-data` entry
# for the migration scripts, and adding one would not do what it looks like it does.
#
# The wheel does ship `aer/_migrations/` (alembic.ini + env.py + versions/*.py), but
# it is staged there at build time by `setup.py`, because the runtime has to be able
# to provision a database from a plain `pip install` (docs/DECISIONS.md D-064).
# A `package-data` pattern is resolved relative to the *source* package directory,
# where `_migrations` does not exist -- and must not, since the repository's
# `migrations/` is the single source of truth and a second copy next to the package
# would be one that can silently go stale.
#
# What actually carries the files into the wheel is `bdist_wheel` installing the
# whole `build_lib` tree. That is a property of the build backend rather than of
# this file, so it is *verified* rather than declared: `.github/workflows/publish.yml`
# installs the built wheel into a clean virtual environment and constructs a store
# with it before anything is uploaded.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["aer", "tests"]
# Markdown files are specifications, not code: ruff must not touch them even
# though they contain python snippets.
extend-exclude = ["data", ".venv", "*.md", "docs", "agent.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aer", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# The knowledge tests carry a Chinese/English corpus, and fullwidth punctuation
# inside it is data rather than prose: the whole point of the mixed-language cases
# is that the tokenizer sees what a Chinese operator would actually type. RUF001
# exists to catch a comma that looks like a comma in code; here it would only
# pressure the fixtures into English.
"tests/knowledge/**" = ["B011", "RUF001"]
# Same reason, and the same subject matter: this drill builds a Chinese knowledge
# corpus and the punctuation is part of the data being searched for.
"scripts/drill_knowledge.py" = ["RUF001"]
# scripts/ are file-invoked operator entry points, not a package, so a sibling
# import has to sit below the sys.path fix-up that makes it resolvable.
"scripts/restore_sqlite.py" = ["E402"]
"scripts/smoke_test.py" = ["E402"]

# ---------------------------------------------------------------------------
# mypy - intentionally light; type checking is not allowed to block delivery
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["aer"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

# NeuG ships no type stubs and no py.typed marker. The override is unconditional
# rather than a per-import ignore because the answer differs by machine -- the
# package is absent on a Windows checkout and present in CI -- and two different
# error codes would otherwise have to be silenced in the same file.
[[tool.mypy.overrides]]
module = ["neug", "neug.*"]
ignore_missing_imports = true
